name: Build & Release UIScope

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'          # e.g. v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (no "v" prefix, e.g. 1.0.0)'
        required: true
        default: '1.0.0'

# ─── Shared version string ────────────────────────────────────────────────────
env:
  APP_VERSION: >-
    ${{ startsWith(github.ref, 'refs/tags/')
        && github.ref_name
        || format('v{0}', inputs.version) }}

permissions:
  contents: write      # needed to create GitHub Releases

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  WINDOWS — EXE · MSI · MSIX                                             ║
  # ╚══════════════════════════════════════════════════════════════════════════╝
  build-windows:
    name: Windows (EXE · MSI · MSIX)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: windows-gradle-${{ hashFiles('uiscope/**/*.gradle.kts', 'uiscope/gradle/libs.versions.toml') }}
          restore-keys: windows-gradle-

      # Strip leading 'v' from tag name → pure semver for Gradle & MSI
      - name: Resolve semver
        id: ver
        run: |
          $raw = "${{ env.APP_VERSION }}"
          $sem = $raw.TrimStart('v')
          echo "SEM=$sem" >> $env:GITHUB_ENV

      - name: Build EXE + MSI
        working-directory: uiscope
        env:
          APP_VERSION: ${{ env.SEM }}
        run: .\gradlew.bat :app:packageExe :app:packageMsi --no-daemon

      # ── MSIX — built from the MSI using makeappx (Windows SDK, pre-installed on runners) ──
      - name: Build MSIX
        shell: pwsh
        env:
          # Set these three secrets in GitHub repo Settings → Secrets → Actions
          # Get values from Microsoft Partner Center → App identity page
          MSIX_PACKAGE_NAME:     ${{ secrets.MSIX_PACKAGE_NAME }}
          MSIX_PUBLISHER:        ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ secrets.MSIX_PUBLISHER_DISPLAY }}
        run: |
          $sem = "${{ env.SEM }}"

          # Fallback values used until Partner Center secrets are added
          $pkgName  = if ($env:MSIX_PACKAGE_NAME)      { $env:MSIX_PACKAGE_NAME }      else { "TITANICBHAIStudios.UIScope" }
          $pub      = if ($env:MSIX_PUBLISHER)          { $env:MSIX_PUBLISHER }          else { "CN=UIScope-Dev" }
          $pubDisp  = if ($env:MSIX_PUBLISHER_DISPLAY)  { $env:MSIX_PUBLISHER_DISPLAY }  else { "TITANICBHAI" }

          # Locate WinSDK makeappx.exe
          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdkBin) { Write-Error "makeappx.exe not found in Windows SDK"; exit 1 }
          Write-Host "Using makeappx: $sdkBin"

          # Stage app content from the MSI output (jpackage app-image)
          $appImage = "uiscope\app\build\compose\binaries\main\app\UIScope"
          if (-not (Test-Path $appImage)) {
            # app-image isn't produced by packageMsi alone — build it explicitly
            Push-Location uiscope
            .\gradlew.bat :app:createReleaseDistributable --no-daemon
            Pop-Location
          }

          $msixStage = "msix-stage"
          New-Item -ItemType Directory -Force -Path $msixStage | Out-Null
          Copy-Item -Path "$appImage\*" -Destination $msixStage -Recurse -Force

          # Write AppxManifest.xml
          $manifest = @"
<?xml version="1.0" encoding="utf-8"?>
<Package
  xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
  xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
  xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">

  <Identity
    Name="$pkgName"
    Publisher="$pub"
    Version="$sem.0"
    ProcessorArchitecture="x64" />

  <Properties>
    <DisplayName>UIScope: Desktop &amp; Android UI Inspector</DisplayName>
    <PublisherDisplayName>$pubDisp</PublisherDisplayName>
    <Logo>Assets\StoreLogo.png</Logo>
  </Properties>

  <Dependencies>
    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
  </Dependencies>

  <Resources>
    <Resource Language="en-us" />
  </Resources>

  <Applications>
    <Application Id="UIScope" Executable="UIScope.exe" EntryPoint="Windows.FullTrustApplication">
      <uap:VisualElements
        DisplayName="UIScope: Desktop &amp; Android UI Inspector"
        Description="See what your UI is made of. Live inspection of Android device UI trees and Windows accessibility trees."
        BackgroundColor="transparent"
        Square150x150Logo="Assets\Square150x150Logo.png"
        Square44x44Logo="Assets\Square44x44Logo.png" />
    </Application>
  </Applications>

  <Capabilities>
    <rescap:Capability Name="runFullTrust" />
  </Capabilities>
</Package>
"@
          $manifest | Set-Content "$msixStage\AppxManifest.xml" -Encoding UTF8

          # Copy icon assets (scale to required sizes using the existing icon.png via magick/built-in)
          $assetsDir = "$msixStage\Assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          $srcIcon = "uiscope\app\src\main\resources\icon.png"

          # Use PowerShell + System.Drawing to resize icons (no ImageMagick needed)
          Add-Type -AssemblyName System.Drawing
          foreach ($spec in @(
            @{Size=44;  Name="Square44x44Logo.png"},
            @{Size=150; Name="Square150x150Logo.png"},
            @{Size=50;  Name="StoreLogo.png"}
          )) {
            $src = [System.Drawing.Image]::FromFile((Resolve-Path $srcIcon))
            $bmp = New-Object System.Drawing.Bitmap($spec.Size, $spec.Size)
            $g   = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.DrawImage($src, 0, 0, $spec.Size, $spec.Size)
            $bmp.Save("$assetsDir\$($spec.Name)", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose(); $src.Dispose()
          }

          # Package
          $outDir = "msix-out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $msixPath = "$outDir\UIScope-$sem-x64.msix"
          & $sdkBin pack /d $msixStage /p $msixPath /nv
          if ($LASTEXITCODE -ne 0) { Write-Error "makeappx failed"; exit 1 }
          Write-Host "MSIX created: $msixPath"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-windows-exe
          path: uiscope/app/build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-windows-msi
          path: uiscope/app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-windows-msix
          path: msix-out/*.msix
          if-no-files-found: warn


  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  Linux — DEB · AppImage                                                 ║
  # ╚══════════════════════════════════════════════════════════════════════════╝
  build-linux:
    name: Linux (DEB · AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'

      - name: Install native packaging deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fakeroot binutils rpm libfuse2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: linux-gradle-${{ hashFiles('uiscope/**/*.gradle.kts', 'uiscope/gradle/libs.versions.toml') }}
          restore-keys: linux-gradle-

      - name: Resolve semver
        run: |
          RAW="${{ env.APP_VERSION }}"
          echo "SEM=${RAW#v}" >> $GITHUB_ENV

      - name: Build DEB + AppImage
        working-directory: uiscope
        env:
          APP_VERSION: ${{ env.SEM }}
        run: ./gradlew :app:packageDeb :app:packageAppImage --no-daemon

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-linux-deb
          path: uiscope/app/build/compose/binaries/main/deb/*.deb
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-linux-appimage
          path: uiscope/app/build/compose/binaries/main/app/*.AppImage
          if-no-files-found: warn


  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  RELEASE — collect all artifacts and publish to GitHub Releases         ║
  # ╚══════════════════════════════════════════════════════════════════════════╝
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List collected files
        run: find dist/ -type f | sort

      - name: Resolve semver
        run: |
          RAW="${{ github.ref_name }}"
          echo "SEM=${RAW#v}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UIScope ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## UIScope ${{ github.ref_name }}
            ### Desktop & Android UI Inspector

            **See what your UI is made of.** Live inspection of Android device UI trees and Windows / macOS / Linux app accessibility trees — all in one desktop app. No accounts, no telemetry, fully offline.

            ### Downloads

            | File | Platform | Notes |
            |------|----------|-------|
            | `UIScope-${{ env.SEM }}.exe` | Windows | NSIS installer — recommended for most users |
            | `UIScope-${{ env.SEM }}.msi` | Windows | MSI — enterprise / Group Policy / silent install |
            | `UIScope-${{ env.SEM }}-x64.msix` | Windows | MSIX — Microsoft Store / WinGet sideload |
            | `uiscope_${{ env.SEM }}-1_amd64.deb` | Linux (Debian/Ubuntu) | `sudo dpkg -i uiscope_*.deb` |
            | `UIScope-${{ env.SEM }}.AppImage` | Linux (universal) | `chmod +x && ./UIScope-*.AppImage` |

            ### Requirements
            - **Windows** 10 / 11 (x64)
            - **Linux** Ubuntu 22.04 or equivalent (x64)
            - **Android inspection** — ADB in PATH, USB Debugging enabled on device

          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.msix
            dist/**/*.deb
            dist/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
