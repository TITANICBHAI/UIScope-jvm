# Release CI (plan P8-3): tagging v* builds the helper, the MSI/EXE installers and the unsigned MSIX,
# computes SHA256SUMS and creates a draft GitHub Release with the CHANGELOG section for the version.
# Can also be run manually from the Actions tab (workflow_dispatch): a manual run builds the same
# artifacts and uploads them as workflow artifacts, but never creates a release — that stays tag-only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and draft release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      # version.txt is the single source of truth (Gradle, the installers and the MSIX all read it). A tag that disagrees would publish
      # installers named for one version under another version's tag, so stop before building anything.
      - name: Check the tag matches version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version.txt (${{ steps.version.outputs.version }}). Fix one of them."
            exit 1
          fi

      # The release page shows this version's CHANGELOG.md section (the engineering history under "Development history" is left out).
      - name: Write the release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            /^### Development history/ { skip = 1; next }
            /^### / { skip = 0 }
            on && !skip { print }
          ' CHANGELOG.md > release-notes.md
          echo "release notes: $(wc -l < release-notes.md) lines"

      # The Windows helper is built by :app:processResources (buildWindowsHelper) on every Windows JVM run.
      - name: Package the installers and the app image
        shell: bash
        run: ./gradlew :app:packageMsi :app:packageExe :app:createDistributable --stacktrace

      - name: Build the unsigned MSIX
        shell: pwsh
        run: scripts/build-msix.ps1 -AppImage "app\build\compose\binaries\main\app\UIScope" -Version "${{ steps.version.outputs.version }}" -Out "dist\UIScope-${{ steps.version.outputs.version }}-x64.msix"

      # Permanent guardrail for the staging regression: the app image's jar must carry
      # helper/UIScope.Helper.exe (the exact resource path WindowsHelperExe.extract reads at start-up).
      - name: Verify the helper is staged in the app image
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $jar = Get-ChildItem "app/build/compose/binaries/main/app/UIScope/app" -Filter "app-*.jar" | Select-Object -First 1
          if ($null -eq $jar) { throw "the app jar was not found in the app image" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
          $helper = $zip.Entries | Where-Object { $_.FullName -eq "helper/UIScope.Helper.exe" }
          $zip.Dispose()
          if ($null -eq $helper) { throw "helper/UIScope.Helper.exe is missing from $($jar.Name) - the staging path broke" }
          Write-Host "staged: $($helper.FullName) ($($helper.Length) bytes)"

      - name: Collect artifacts and SHA256SUMS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $msis = Get-ChildItem "app\build\compose\binaries\main\msi" -Filter *.msi -ErrorAction SilentlyContinue
          $exes = Get-ChildItem "app\build\compose\binaries\main\exe" -Filter *.exe -ErrorAction SilentlyContinue
          # @() wraps them: with exactly one match Get-ChildItem returns a scalar FileInfo, and FileInfo + FileInfo throws.
          @($msis) + @($exes) | ForEach-Object { Copy-Item $_.FullName dist\ }
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File dist\SHA256SUMS -Append -Encoding ascii
          }
          Get-Content dist\SHA256SUMS

      - name: Upload the artifacts (also for manual runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-dist
          path: dist/*
          if-no-files-found: error

      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/SHA256SUMS
            dist/*.msi
            dist/*.exe
            dist/*.msix
