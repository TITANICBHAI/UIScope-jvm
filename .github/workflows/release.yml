name: Build & Release UIScope

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'          # e.g. v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (no "v" prefix, e.g. 1.0.0)'
        required: true
        default: '1.0.0'

# ─── Shared version string ────────────────────────────────────────────────────
env:
  APP_VERSION: >-
    ${{ startsWith(github.ref, 'refs/tags/')
        && github.ref_name
        || format('v{0}', inputs.version) }}

permissions:
  contents: write      # needed to create GitHub Releases

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  WINDOWS — EXE · MSI                                                   ║
  # ╚══════════════════════════════════════════════════════════════════════════╝
  build-windows:
    name: Windows (EXE · MSI)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: windows-gradle-${{ hashFiles('uiscope/**/*.gradle.kts', 'uiscope/gradle/libs.versions.toml') }}
          restore-keys: windows-gradle-

      # Strip leading 'v' from tag name → pure semver for Gradle & MSI
      - name: Resolve semver
        id: ver
        run: |
          $raw = "${{ env.APP_VERSION }}"
          $sem = $raw.TrimStart('v')
          echo "SEM=$sem" >> $env:GITHUB_ENV

      - name: Build EXE + MSI
        working-directory: uiscope
        env:
          APP_VERSION: ${{ env.SEM }}
        run: .\gradlew.bat :app:packageExe :app:packageMsi --no-daemon

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-windows-exe
          path: uiscope/app/build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-windows-msi
          path: uiscope/app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn


  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  Linux — DEB · AppImage                                                 ║
  # ╚══════════════════════════════════════════════════════════════════════════╝
  build-linux:
    name: Linux (DEB · AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'

      - name: Install native packaging deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fakeroot binutils rpm libfuse2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: linux-gradle-${{ hashFiles('uiscope/**/*.gradle.kts', 'uiscope/gradle/libs.versions.toml') }}
          restore-keys: linux-gradle-

      - name: Resolve semver
        run: |
          RAW="${{ env.APP_VERSION }}"
          echo "SEM=${RAW#v}" >> $GITHUB_ENV

      - name: Build DEB + AppImage
        working-directory: uiscope
        env:
          APP_VERSION: ${{ env.SEM }}
        run: ./gradlew :app:packageDeb :app:packageAppImage --no-daemon

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-linux-deb
          path: uiscope/app/build/compose/binaries/main/deb/*.deb
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-linux-appimage
          path: uiscope/app/build/compose/binaries/main/app/*.AppImage
          if-no-files-found: warn


  # ╔══════════════════════════════════════════════════════════════════════════╗
  # ║  RELEASE — collect all artifacts and publish to GitHub Releases         ║
  # ╚══════════════════════════════════════════════════════════════════════════╝
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List collected files
        run: find dist/ -type f | sort

      - name: Resolve semver
        run: |
          RAW="${{ github.ref_name }}"
          echo "SEM=${RAW#v}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UIScope ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## UIScope ${{ github.ref_name }}

            **See what your UI is made of.** Live inspection of Android device UI trees and Windows / macOS / Linux accessibility trees — all in one desktop app.

            ### What's in this release

            | File | Platform | Notes |
            |------|----------|-------|
            | `UIScope-Setup-*.exe` | Windows | NSIS installer — recommended for most users |
            | `UIScope-*.msi` | Windows | MSI — for enterprise / Group Policy deployment |
            | `UIScope-*.deb` | Linux (Debian/Ubuntu) | `sudo dpkg -i UIScope-*.deb` |
            | `UIScope-*.AppImage` | Linux (universal) | `chmod +x && ./UIScope-*.AppImage` |

            ### Requirements
            - **Windows** 10 / 11 (x64)
            - **Linux** Ubuntu 22.04 or equivalent (x64)
            - **Android inspection** — ADB in PATH and USB Debugging enabled on device

            ### Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/uiscope/CHANGELOG.md) for full details.

          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
