name: Build & Release UIScope

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (no "v" prefix, e.g. 1.0.0)'
        required: true
        default: '1.0.0'

env:
  APP_VERSION: >-
    ${{ startsWith(github.ref, 'refs/tags/')
        && github.ref_name
        || format('v{0}', inputs.version) }}

permissions:
  contents: write

jobs:

  # ── Windows: EXE · MSI · MSIX ────────────────────────────────────────────
  build-windows:
    name: Windows (EXE · MSI · MSIX)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: windows-gradle-${{ hashFiles('uiscope/**/*.gradle.kts', 'uiscope/gradle/libs.versions.toml') }}
          restore-keys: windows-gradle-

      - name: Resolve semver
        run: |
          $raw = "${{ env.APP_VERSION }}"
          $sem = $raw.TrimStart('v')
          echo "SEM=$sem" >> $env:GITHUB_ENV

      - name: Build EXE + MSI
        working-directory: uiscope
        env:
          APP_VERSION: ${{ env.SEM }}
        run: .\gradlew.bat :app:packageExe :app:packageMsi --no-daemon

      - name: Build MSIX
        env:
          BUILD_SEM: ${{ env.SEM }}
          MSIX_PACKAGE_NAME: ${{ secrets.MSIX_PACKAGE_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ secrets.MSIX_PUBLISHER_DISPLAY }}
        run: |
          $pkgName = if ($env:MSIX_PACKAGE_NAME)      { $env:MSIX_PACKAGE_NAME }      else { 'TBTechs.UIScopeDesktopAndroidUIInspector' }
          $pub     = if ($env:MSIX_PUBLISHER)          { $env:MSIX_PUBLISHER }          else { 'CN=E08824C8-6F22-4DC2-8025-DD8C707E2BE9' }
          $disp    = if ($env:MSIX_PUBLISHER_DISPLAY)  { $env:MSIX_PUBLISHER_DISPLAY }  else { 'TBTechs' }
          .\scripts\build-msix.ps1 -Version $env:BUILD_SEM -PackageName $pkgName -Publisher $pub -PublisherDisplay $disp

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-windows-exe
          path: uiscope/app/build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-windows-msi
          path: uiscope/app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-windows-msix
          path: msix-out/*.msix
          if-no-files-found: warn


  # ── Linux: DEB · AppImage ─────────────────────────────────────────────────
  build-linux:
    name: Linux (DEB · AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 19 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '19'

      - name: Install packaging deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fakeroot binutils rpm libfuse2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: linux-gradle-${{ hashFiles('uiscope/**/*.gradle.kts', 'uiscope/gradle/libs.versions.toml') }}
          restore-keys: linux-gradle-

      - name: Resolve semver
        run: |
          RAW="${{ env.APP_VERSION }}"
          echo "SEM=${RAW#v}" >> $GITHUB_ENV

      - name: Build DEB + AppImage
        working-directory: uiscope
        env:
          APP_VERSION: ${{ env.SEM }}
        run: ./gradlew :app:packageDeb :app:packageAppImage --no-daemon

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-linux-deb
          path: uiscope/app/build/compose/binaries/main/deb/*.deb
          if-no-files-found: warn

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-linux-appimage
          path: uiscope/app/build/compose/binaries/main/app/*.AppImage
          if-no-files-found: warn


  # ── Release: publish to GitHub Releases ──────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List files
        run: find dist/ -type f | sort

      - name: Resolve semver
        run: |
          RAW="${{ github.ref_name }}"
          echo "SEM=${RAW#v}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "UIScope ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## UIScope ${{ github.ref_name }} — Desktop & Android UI Inspector

            **See what your UI is made of.** Live inspection of Android device UI trees and Windows/Linux accessibility trees. No accounts, no telemetry, fully offline.

            ### Downloads

            | File | Platform | Install |
            |------|----------|---------|
            | `UIScope-${{ env.SEM }}.exe` | Windows 10/11 | Double-click — recommended |
            | `UIScope-${{ env.SEM }}.msi` | Windows 10/11 | `msiexec /i` — enterprise/silent |
            | `UIScope-${{ env.SEM }}-x64.msix` | Windows 10/11 | Microsoft Store / WinGet sideload |
            | `uiscope_${{ env.SEM }}-1_amd64.deb` | Ubuntu/Debian | `sudo dpkg -i uiscope_*.deb` |
            | `UIScope-${{ env.SEM }}.AppImage` | Linux (universal) | `chmod +x && ./UIScope-*.AppImage` |

            **Microsoft Store:** https://apps.microsoft.com/detail/9MWH310XHGQ5

            ### Requirements
            - Windows 10/11 (x64) or Ubuntu 22.04+ (x64)
            - Android inspection: ADB in PATH, USB Debugging enabled on device

          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.msix
            dist/**/*.deb
            dist/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
