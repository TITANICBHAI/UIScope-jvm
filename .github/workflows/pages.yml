name: Website (optional, manual)

# The site in web/ is plain HTML. If GitHub Pages is set to "Deploy from a branch" (main, root) it is already served at
#   https://titanicbhai.github.io/UIScope-jvm/web/      -- nothing to do, and this workflow is not needed.
# To serve it at the root URL instead, set Settings > Pages > Source to "GitHub Actions" and run this workflow once by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Both layouts keep working: the site at the root, and a copy under /web/ for the links the app already ships.
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r web/. _site/
          mkdir _site/web
          cp -r web/. _site/web/
          rm -rf _site/web/web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
