# Debug build (owner request): build the Windows EXE installer on every push to main and on demand —
# no tag, no release. The EXE lands on each run as the UIScope-debug-exe artifact.
# Run it from the Actions tab: Run workflow → pick main. For tagged releases use the Release workflow instead.
name: Debug build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  exe:
    name: build debug exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The Windows helper is built by :app:processResources (buildWindowsHelper) on every Windows JVM run.
      - name: Package the EXE
        shell: bash
        run: ./gradlew :app:packageExe --stacktrace

      # Permanent guardrail for the staging regression: the app jar must carry helper/UIScope.Helper.exe
      # (that exact resource path is what WindowsHelperExe.extract reads at start-up).
      - name: Verify the helper is staged in the app jar
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $jar = Get-ChildItem "app/build/compose/binaries/main/app/UIScope/app" -Filter "app-*.jar" | Select-Object -First 1
          if ($null -eq $jar) { throw "the app jar was not found in the app image" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
          $helper = $zip.Entries | Where-Object { $_.FullName -eq "helper/UIScope.Helper.exe" }
          $zip.Dispose()
          if ($null -eq $helper) { throw "helper/UIScope.Helper.exe is missing from $($jar.Name) - the staging path broke" }
          Write-Host "staged: $($helper.FullName) ($($helper.Length) bytes)"

      - name: Upload the EXE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UIScope-debug-exe
          path: app/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
          retention-days: 14
