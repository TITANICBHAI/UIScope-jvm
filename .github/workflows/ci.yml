name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew check
        shell: bash
        # Compose UI tests need a display: Linux runners get xvfb, Windows runners have a desktop session.
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -a ./gradlew check --stacktrace
          else
            ./gradlew check --stacktrace
          fi

      # Test and detekt reports are published for every run, green or red (P0-6).
      - name: Upload test and detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/detekt/
          if-no-files-found: ignore

  # P7-3: dependency vulnerability review on pull requests (pushes rely on the Dependabot alerts
  # configured in .github/dependabot.yml, since the review action is PR-only by design).
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  helper-check:
    # The Windows helper must stay C# 5 (the Framework compiler on every Windows box); this catches C# 6+ syntax and a broken protocol helper
    # on Linux in a minute, before the Windows leg builds the real exe. See native/windows-helper/tests/check.sh.
    name: windows helper (C# 5 + logic tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-mcs mono-runtime libmono-system-windows-forms4.0-cil libmono-system-drawing4.0-cil libmono-windowsbase4.0-cil libmono-system-core4.0-cil
      - name: Compile and test the helper
        run: bash native/windows-helper/tests/check.sh
