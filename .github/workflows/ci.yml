name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew check
        shell: bash
        run: ./gradlew check --stacktrace

      # Test and detekt reports are published for every run, green or red (P0-6).
      - name: Upload test and detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/detekt/
          if-no-files-found: ignore
