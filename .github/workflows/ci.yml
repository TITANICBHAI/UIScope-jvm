name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up .NET (Windows helper, P3-1)
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Windows helper
        if: runner.os == 'Windows'
        run: dotnet build native/windows-helper/UIScope.Helper.csproj -c Release -o native/windows-helper/bin

      - name: ./gradlew check
        shell: bash
        # Compose UI tests need a display: Linux runners get xvfb, Windows runners have a desktop session.
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y xvfb
            xvfb-run -a ./gradlew check --stacktrace
          else
            ./gradlew check --stacktrace
          fi

      # Test and detekt reports are published for every run, green or red (P0-6).
      - name: Upload test and detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/detekt/
          if-no-files-found: ignore
